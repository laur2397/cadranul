# Integrarea continua Cadranul: nimic nu intra pe main daca pica una dintre verificari.
name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: true }

jobs:
  secrete:
    name: Secrete scapate in cod (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  verificari:
    name: Tipuri, teste, compilare, teste in browser
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: cadranul }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URI: postgres://postgres:ci@localhost:5432/cadranul
      PAYLOAD_SECRET: ci-doar-pentru-teste-nu-e-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_DEMO: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Registre de audit si regula incarcatorului unic
        run: npm run audit:registru
      - run: npm run typecheck
      - run: npm test
      - name: Baza de date si continutul demonstrativ
        run: npx payload migrate && npm run seed
      - run: npm run build
      - name: Teste in browser (coduri, consimtamant, accesibilitate, latime 390 px)
        run: |
          npx playwright install --with-deps chromium
          (npm start &) && npx --yes wait-on@8.0.4 http://localhost:3000 -t 60000
          npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with: { name: raport-playwright, path: test-results/, retention-days: 7 }
